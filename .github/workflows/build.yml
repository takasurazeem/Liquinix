# On every commit to main and every pull request into main: checks that Liquinix builds (build.cmd plus the 32/64-bit title bar DLLs).
# Releases are published with tools\publicar.ps1. They never carry Apple's fonts, sounds or cursors: the installer
# downloads those on the user's PC.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          call build.cmd || exit /b 1
          call build.cmd janelas || exit /b 1
