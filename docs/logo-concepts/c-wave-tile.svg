<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Liquinix logo concept C: an app tile half filled with a liquid wave (original drawing, GPL-3.0 with the project) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A4A"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FE0D2"/><stop offset="0.5" stop-color="#2F9BFF"/><stop offset="1" stop-color="#3B4FE0"/></linearGradient>
    <linearGradient id="water2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FF0E4" stop-opacity="0.6"/><stop offset="1" stop-color="#7FB8FF" stop-opacity="0.35"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="40" y="40" width="432" height="432" rx="100"/></clipPath>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <path d="M40 268 C110 228 170 228 240 262 C310 296 380 300 472 250 L472 472 L40 472 Z" fill="url(#water2)"/>
    <path d="M40 292 C120 256 186 260 256 292 C326 324 398 326 472 286 L472 472 L40 472 Z" fill="url(#water)"/>
    <rect x="40" y="40" width="432" height="200" fill="url(#gloss)"/>
  </g>
  <rect x="42" y="42" width="428" height="428" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>
</svg>
