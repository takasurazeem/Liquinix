<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Liquinix logo concept B: three overlapping glass windows (original drawing, GPL-3.0 with the project) -->
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#0A7AE6"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E8BFF"/><stop offset="1" stop-color="#5B4BDB"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EE7C8"/><stop offset="1" stop-color="#15A88A"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/></linearGradient>
  </defs>
  <g transform="rotate(-8 256 256)">
    <rect x="70" y="150" width="250" height="200" rx="34" fill="url(#p2)" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5"/>
    <rect x="70" y="150" width="250" height="42" rx="34" fill="url(#bar)"/>
  </g>
  <g transform="rotate(4 256 256)">
    <rect x="190" y="110" width="250" height="200" rx="34" fill="url(#p1)" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="5"/>
    <rect x="190" y="110" width="250" height="42" rx="34" fill="url(#bar)"/>
  </g>
  <g transform="rotate(-2 256 256)">
    <rect x="140" y="250" width="250" height="190" rx="34" fill="url(#p3)" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5"/>
    <rect x="140" y="250" width="250" height="42" rx="34" fill="url(#bar)"/>
  </g>
</svg>
